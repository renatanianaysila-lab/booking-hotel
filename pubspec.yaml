name: booking_hotel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Logo.png
    - assets/Ellipse_1.png
    - assets/arrows_1.png

  fonts:
    - family: InclusiveSans
      fonts:
        - asset: fonts/InclusiveSans-Medium.ttf
          weight: 500