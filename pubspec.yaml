name: booking_hotel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    assets:
  - assets/Logo.png
  - assets/Ellipse_1.png
  - assets/arrows_1.png
  - assets/google.png
  - assets/facebook.png
  - assets/apple.png
  - assets/bumimajapahit.png
  - assets/bumisurabaaya.png
  - assets/cari.png
  - assets/ciputra.png
  - assets/lokasi.png
  - assets/nav_awal.png
  - assets/notif.png
  - assets/other.png


  fonts:
    - family: InclusiveSans
      fonts:
        - asset: fonts/static/InclusiveSans-Regular.ttf
          weight: 400
        - asset: fonts/static/InclusiveSans-Medium.ttf
          weight: 500
        - asset: fonts/static/InclusiveSans-SemiBold.ttf
          weight: 600
        - asset: fonts/static/InclusiveSans-Bold.ttf
          weight: 700